name: Build

# Every push and every pull request has to compile and pass lint. A repository
# whose main branch does not build is a repository nobody can contribute to.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile and lint
        run: ./gradlew assembleDebug lintDebug --no-daemon

      # The screenshot tests render Compose on the JVM through Robolectric, so
      # they need no emulator and no device -- which is the only reason they can
      # run on every push rather than once a month by hand.
      - name: Check the design system has not drifted
        run: ./gradlew :app:testDebugUnitTest --no-daemon -Proborazzi.test.verify=true

      # Only useful when the step above failed, which is exactly when you want
      # to see what changed rather than read a hash mismatch.
      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the debug APK for a week
        uses: actions/upload-artifact@v4
        with:
          name: cineverse-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
